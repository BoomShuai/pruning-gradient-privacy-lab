name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2022
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Mathematical and integration checks
        run: python -m unittest discover -s tests -v
      - name: Synthetic experiment smoke check
        run: python -m pruning_gradient_privacy run --output outputs/ci --seed 42 --dimension 4 --trials 1 --rhos 0,0.5,1 --budgets 0,10
